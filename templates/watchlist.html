{% extends "base.html" %}
{% block title %}My Watchlist{% endblock %}
{% block content %}
<h1>My Watchlist</h1>
{% if entries %}
  <div class="cards">
    {% for w in entries %}
      <div class="card">
        <a href="{{ url_for('road_detail', osm_type=w.road.element_type, osm_id=w.road.osm_id) }}">
          <span dir="auto">{{ w.road.name or "Unnamed road" }}</span>
        </a>
        <form method="post" action="{{ url_for('watchlist_delete', entry_id=w.id) }}">
          <button class="btn remove">Remove</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p>Your watchlist is empty. Open a road and save it.</p>
{% endif %}
{% endblock %}
