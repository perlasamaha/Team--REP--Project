{% extends "base.html" %}
{% block title %}Edit note{% endblock %}
{% block content %}
<h1>Edit note</h1>
<form method="post" action="{{ url_for('note_edit', note_id=note.id) }}" novalidate class="auth">
  <label>Note <textarea name="content" rows="3">{{ data.get('content','') }}</textarea></label>
  {% if errors.get('content') %}<span class="error">{{ errors['content'] }}</span>{% endif %}
  <button type="submit">Save changes</button>
</form>
<p><a href="{{ url_for('report_detail', report_id=note.report_id) }}">Back to the report</a></p>
{% endblock %}
